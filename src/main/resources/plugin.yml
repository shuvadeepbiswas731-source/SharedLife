name: SharedHealthHunger
version: '2.0.0'
main: me.shared.SharedHealthHunger
api-version: '1.21'
description: Shared health, hunger, and automated hardcore run system for modern Minecraft.
authors: [Shared]
commands:
  resetrun:
    description: Resets the shared health run.
    permission: shared.admin
    usage: /resetrun
  setrun:
    description: Sets the current run ID manually.
    permission: shared.admin
    usage: /setrun <id>
  lobbysound:
    description: Toggles the lobby ticking sound for yourself.
    aliases: [mute]
    usage: /lobbysound

